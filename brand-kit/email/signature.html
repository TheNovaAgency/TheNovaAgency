<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova email signature</title>
<!--
  NOVA email signature. Copy everything between the SIGNATURE START / END comments.
  1. Replace [Name], [Role], [Phone], [Email] (also inside the tel: and mailto: links).
  2. The mark image MUST be hosted on a public HTTPS URL before use: upload
     logo/png/nova-mark-small-light-56.png (e.g. to https://thenovaagency.com/brand/nova-mark-small-light-56.png)
     and replace the relative src below. Mail clients cannot load relative paths.
  Everything is inline-styled tables so it survives Outlook, Gmail and Apple Mail.
-->
</head>
<body style="margin:0;padding:24px;background:#F7F3F0;">
<!-- SIGNATURE START -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;background:#F7F3F0;font-family:'Space Grotesk',Arial,Helvetica,sans-serif;color:#0A0607;">
  <tr>
    <td style="padding:0 0 12px 0;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
        <tr>
          <td valign="middle" style="padding:0 10px 0 0;line-height:0;">
            <img src="../logo/png/nova-mark-small-light-56.png" width="28" height="28" alt="Nova" style="display:block;width:28px;height:28px;border:0;outline:none;text-decoration:none;">
          </td>
          <td valign="middle" style="font-family:'Space Grotesk',Arial,Helvetica,sans-serif;font-size:16px;line-height:16px;font-weight:700;letter-spacing:2.5px;color:#0A0607;">NOVA</td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td style="padding:0;">
      <table role="presentation" width="320" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;width:320px;">
        <tr><td height="1" bgcolor="#FF4B2B" style="height:1px;line-height:1px;font-size:1px;background:#FF4B2B;">&nbsp;</td></tr>
      </table>
    </td>
  </tr>
  <tr>
    <td style="padding:14px 0 2px 0;font-family:'Space Grotesk',Arial,Helvetica,sans-serif;font-size:16px;line-height:22px;font-weight:700;color:#0A0607;">[Name]</td>
  </tr>
  <tr>
    <td style="padding:0 0 10px 0;font-family:'Space Grotesk',Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;color:#5E504C;">[Role], The Nova Agency</td>
  </tr>
  <tr>
    <td style="padding:0;font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:12px;line-height:20px;color:#5E504C;">
      <span style="color:#C42A0E;">T</span>&nbsp;<a href="tel:[Phone]" style="color:#0A0607;text-decoration:none;">[Phone]</a><br>
      <span style="color:#C42A0E;">E</span>&nbsp;<a href="mailto:[Email]" style="color:#0A0607;text-decoration:none;">[Email]</a><br>
      <span style="color:#C42A0E;">W</span>&nbsp;<a href="https://thenovaagency.com" style="color:#0A0607;text-decoration:none;">thenovaagency.com</a>&nbsp;&nbsp;<span style="color:#7A6A66;">/</span>&nbsp;&nbsp;<span style="color:#0A0607;">@thenovaagency</span>
    </td>
  </tr>
  <tr>
    <td style="padding:12px 0 0 0;font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:10px;line-height:14px;letter-spacing:2px;text-transform:uppercase;color:#C42A0E;">THE NOVA AGENCY &middot; ESSEX, UK</td>
  </tr>
</table>
<!-- SIGNATURE END -->
</body>
</html>
